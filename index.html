<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Flappy</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --yellow: #ffcf33;
    --yellow-deep: #f5a623;
    --yellow-soft: #ffe57a;
    --sky-top: #fff3c4;
    --sky-bot: #ffd54a;
    --ink: #4a3208;
    --ink-soft: #7a5c1e;
    --pipe: #e6a91f;
    --pipe-dark: #c9890f;
    --panel: rgba(255,255,255,.82);
    --shadow: 0 20px 50px rgba(180,120,10,.35);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Baloo 2', system-ui, sans-serif;
    background:
      radial-gradient(900px 500px at 50% -10%, var(--sky-top), transparent 60%),
      linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bot) 100%);
    color: var(--ink);
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .app { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 16px; }

  header { display: flex; align-items: center; justify-content: space-between; }
  .title { display: flex; align-items: center; gap: 11px; }
  .logo {
    width: 42px; height: 42px; border-radius: 12px;
    background: linear-gradient(145deg, var(--yellow), var(--yellow-deep));
    display: grid; place-items: center; font-size: 22px;
    box-shadow: 0 8px 18px rgba(245,166,35,.45);
  }
  h1 { font-size: 27px; font-weight: 700; letter-spacing: -0.3px; }
  .subtitle { color: var(--ink-soft); font-size: 12.5px; margin-top: -2px; }
  .best-card {
    background: var(--panel); border: 1px solid rgba(180,120,10,.2);
    border-radius: 12px; padding: 7px 15px; text-align: center;
  }
  .best-card .label { font-size: 10px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--ink-soft); }
  .best-card .value { font-size: 21px; font-weight: 700; color: var(--yellow-deep); font-variant-numeric: tabular-nums; }

  .board-wrap {
    position: relative; border-radius: 20px; overflow: hidden;
    box-shadow: var(--shadow); border: 3px solid rgba(255,255,255,.6);
  }
  canvas { display: block; width: 100%; height: auto; touch-action: manipulation; cursor: pointer; }

  .overlay {
    position: absolute; inset: 0;
    background: rgba(255, 236, 170, .55);
    backdrop-filter: blur(3px);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; text-align: center; padding: 26px; transition: opacity .25s ease;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .overlay h2 { font-size: 28px; font-weight: 700; letter-spacing: -0.4px; color: var(--ink); }
  .overlay p { color: var(--ink-soft); font-size: 14px; max-width: 260px; line-height: 1.5; }
  .big { color: var(--yellow-deep); font-weight: 700; }

  .btn {
    font-family: inherit; font-size: 16px; font-weight: 600; color: var(--ink);
    background: linear-gradient(145deg, var(--yellow-soft), var(--yellow));
    border: none; border-radius: 12px; padding: 13px 30px; cursor: pointer;
    box-shadow: 0 8px 20px rgba(245,166,35,.45);
    transition: transform .12s ease, box-shadow .12s ease, filter .12s ease;
  }
  .btn:hover { transform: translateY(-2px); filter: brightness(1.04); box-shadow: 0 12px 26px rgba(245,166,35,.55); }
  .btn:active { transform: translateY(0); }
  .btn:focus-visible { outline: 3px solid rgba(245,166,35,.55); outline-offset: 2px; }

  .footer { display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--ink-soft); font-size: 12.5px; }
  kbd {
    font-family: inherit; font-size: 11px; background: var(--panel);
    border: 1px solid rgba(180,120,10,.25); border-bottom-width: 2px;
    border-radius: 6px; padding: 2px 8px; color: var(--ink);
  }
</style>
</head>
<body>
  <div class="app">
    <header>
      <div class="title">
        <div class="logo" aria-hidden="true">F</div>
        <div>
          <h1>Flappy</h1>
          <div class="subtitle">Tap to flap. Mind the pipes.</div>
        </div>
      </div>
      <div class="best-card">
        <div class="label">Best</div>
        <div class="value" id="best">0</div>
      </div>
    </header>

    <div class="board-wrap">
      <canvas id="board" width="400" height="560" aria-label="Flappy game board"></canvas>
      <div class="overlay" id="overlay">
        <h2 id="ov-title">Flappy</h2>
        <p id="ov-text">Tap, click, or press Space to flap the bird up. Fly through the gaps and don't hit the pipes.</p>
        <button class="btn" id="startBtn">Start</button>
      </div>
    </div>

    <div class="footer">
      <kbd>Space</kbd><kbd>Click</kbd><span>or tap to flap</span>
    </div>
  </div>

<script>
(() => {
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ov-title');
  const ovText = document.getElementById('ov-text');
  const startBtn = document.getElementById('startBtn');

  // Tunables
  const GRAVITY = 0.45;
  const FLAP = -7.6;
  const PIPE_W = 62;
  const GAP = 158;          // vertical gap between pipes
  const PIPE_SPACING = 220; // horizontal distance between pipe pairs
  const SPEED = 2.4;
  const GROUND_H = 54;
  const BIRD_X = 96;
  const R = 15;             // bird radius

  let bird, pipes, score, best = 0, frame;
  let state = 'ready';      // ready | playing | dead
  let flapAnim = 0;

  function reset() {
    bird = { y: H * 0.42, v: 0 };
    pipes = [];
    score = 0;
    frame = 0;
    // seed initial pipes off-screen to the right
    for (let i = 0; i < 3; i++) addPipe(W + 40 + i * PIPE_SPACING);
  }

  function addPipe(x) {
    const margin = 60;
    const minTop = margin;
    const maxTop = H - GROUND_H - GAP - margin;
    const top = minTop + Math.random() * (maxTop - minTop);
    pipes.push({ x, top, passed: false });
  }

  function start() {
    reset();
    state = 'playing';
    overlay.classList.add('hidden');
  }

  function flap() {
    if (state === 'ready') { start(); }
    if (state === 'playing') { bird.v = FLAP; flapAnim = 6; }
    else if (state === 'dead') { start(); }
  }

  function die() {
    state = 'dead';
    if (score > best) { best = score; bestEl.textContent = best; }
    ovTitle.textContent = 'Game Over';
    ovText.innerHTML = `You scored <span class="big">${score}</span> point${score === 1 ? '' : 's'}.` +
      (score === best && score > 0 ? ' New best!' : '');
    startBtn.textContent = 'Play Again';
    overlay.classList.remove('hidden');
  }

  function update() {
    if (state !== 'playing') return;
    frame++;
    if (flapAnim > 0) flapAnim--;

    bird.v += GRAVITY;
    bird.y += bird.v;

    // Move pipes, recycle, score
    for (const p of pipes) {
      p.x -= SPEED;
      if (!p.passed && p.x + PIPE_W < BIRD_X - R) {
        p.passed = true;
        score++;
      }
    }
    // Recycle off-screen pipes to the right
    if (pipes.length && pipes[0].x + PIPE_W < 0) {
      pipes.shift();
      const lastX = pipes[pipes.length - 1].x;
      addPipe(lastX + PIPE_SPACING);
    }

    // Collisions
    const groundY = H - GROUND_H;
    if (bird.y + R >= groundY) { bird.y = groundY - R; die(); return; }
    if (bird.y - R <= 0) { bird.y = R; bird.v = 0; }

    for (const p of pipes) {
      const inX = BIRD_X + R > p.x && BIRD_X - R < p.x + PIPE_W;
      if (inX) {
        const gapTop = p.top, gapBot = p.top + GAP;
        if (bird.y - R < gapTop || bird.y + R > gapBot) { die(); return; }
      }
    }
  }

  // ---- Drawing ----
  function drawBackground() {
    // sky already via canvas bg fill
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#fff3c4');
    g.addColorStop(1, '#ffd54a');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // soft clouds
    ctx.fillStyle = 'rgba(255,255,255,.45)';
    cloud(70, 90, 1);
    cloud(300, 150, 1.3);
    cloud(200, 60, .8);
  }
  function cloud(x, y, s) {
    ctx.beginPath();
    ctx.arc(x, y, 18*s, 0, 7); ctx.arc(x+20*s, y+6*s, 22*s, 0, 7);
    ctx.arc(x+44*s, y, 16*s, 0, 7); ctx.arc(x+22*s, y-8*s, 16*s, 0, 7);
    ctx.fill();
  }

  function drawPipes() {
    for (const p of pipes) {
      const gapBot = p.top + GAP;
      const grd = ctx.createLinearGradient(p.x, 0, p.x + PIPE_W, 0);
      grd.addColorStop(0, '#f3bb2e');
      grd.addColorStop(0.5, '#e6a91f');
      grd.addColorStop(1, '#c9890f');
      ctx.fillStyle = grd;
      ctx.strokeStyle = 'rgba(120,80,6,.55)';
      ctx.lineWidth = 2.5;

      // top pipe + lip
      rr(p.x, 0, PIPE_W, p.top, 6, true, true);
      rr(p.x - 5, p.top - 22, PIPE_W + 10, 22, 6, true, true);
      // bottom pipe + lip
      const bh = H - GROUND_H - gapBot;
      rr(p.x, gapBot, PIPE_W, bh, 6, true, true);
      rr(p.x - 5, gapBot, PIPE_W + 10, 22, 6, true, true);
    }
  }

  function rr(x, y, w, h, r, fill, stroke) {
    if (h <= 0) return;
    r = Math.min(r, w/2, Math.abs(h)/2);
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, r);
    if (fill) ctx.fill();
    if (stroke) ctx.stroke();
  }

  function drawGround() {
    const y = H - GROUND_H;
    ctx.fillStyle = '#f5a623';
    ctx.fillRect(0, y, W, GROUND_H);
    ctx.fillStyle = '#e6931a';
    // scrolling stripes
    const off = (frame * SPEED) % 28;
    for (let x = -off; x < W; x += 28) {
      ctx.beginPath();
      ctx.moveTo(x, y); ctx.lineTo(x + 14, y); ctx.lineTo(x + 14 - 8, y + 12); ctx.lineTo(x - 8, y + 12);
      ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = 'rgba(120,80,6,.25)';
    ctx.fillRect(0, y, W, 3);
  }

  function drawBird() {
    const angle = Math.max(-0.5, Math.min(1.1, bird.v * 0.06));
    ctx.save();
    ctx.translate(BIRD_X, bird.y);
    ctx.rotate(angle);

    // body
    ctx.fillStyle = '#ffcf33';
    ctx.strokeStyle = '#c9890f';
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(0, 0, R, 0, 7); ctx.fill(); ctx.stroke();

    // belly highlight
    ctx.fillStyle = '#ffe57a';
    ctx.beginPath(); ctx.arc(-3, 4, R*0.62, 0, 7); ctx.fill();

    // wing (flaps)
    ctx.fillStyle = '#f5a623';
    ctx.strokeStyle = '#c9890f';
    const wy = flapAnim > 3 ? -6 : 3;
    ctx.beginPath();
    ctx.ellipse(-3, wy, 8, 5.5, -0.3, 0, 7);
    ctx.fill(); ctx.stroke();

    // eye
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(6, -5, 5, 0, 7); ctx.fill();
    ctx.fillStyle = '#3a2a06';
    ctx.beginPath(); ctx.arc(7.5, -5, 2.4, 0, 7); ctx.fill();

    // beak
    ctx.fillStyle = '#f37820';
    ctx.beginPath();
    ctx.moveTo(R - 2, -1); ctx.lineTo(R + 8, 2); ctx.lineTo(R - 2, 6);
    ctx.closePath(); ctx.fill();

    ctx.restore();
  }

  function drawScore() {
    if (state === 'ready') return;
    ctx.save();
    ctx.font = "800 46px 'Baloo 2', sans-serif";
    ctx.textAlign = 'center';
    ctx.lineWidth = 5;
    ctx.strokeStyle = 'rgba(120,80,6,.6)';
    ctx.fillStyle = '#fff';
    ctx.strokeText(score, W/2, 74);
    ctx.fillText(score, W/2, 74);
    ctx.restore();
  }

  function render() {
    drawBackground();
    drawPipes();
    drawGround();
    drawBird();
    drawScore();
  }

  function loop() {
    update();
    render();
    requestAnimationFrame(loop);
  }

  // Input
  function onFlap(e) { e.preventDefault(); flap(); }
  canvas.addEventListener('mousedown', onFlap);
  canvas.addEventListener('touchstart', onFlap, { passive: false });
  startBtn.addEventListener('click', (e) => { e.stopPropagation(); flap(); });
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.key === ' ' || e.key === 'ArrowUp') { e.preventDefault(); flap(); }
  });

  reset();
  loop();
})();
</script>
