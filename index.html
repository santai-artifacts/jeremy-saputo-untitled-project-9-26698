<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Snake</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --panel-2: #1c2330;
    --grid: #12181f;
    --accent: #3ddc84;
    --accent-2: #2bb673;
    --food: #ff5d5d;
    --text: #e6edf3;
    --muted: #8b98a5;
    --border: #263041;
    --shadow: 0 20px 60px rgba(0,0,0,.55);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Space Grotesk', system-ui, sans-serif;
    background:
      radial-gradient(1200px 600px at 20% -10%, #16241d 0%, transparent 55%),
      radial-gradient(1000px 500px at 100% 0%, #1a2030 0%, transparent 50%),
      var(--bg);
    color: var(--text);
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .app {
    width: 100%;
    max-width: 520px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
  }
  .title {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .logo {
    width: 40px; height: 40px;
    border-radius: 11px;
    background: linear-gradient(145deg, var(--accent), var(--accent-2));
    display: grid; place-items: center;
    box-shadow: 0 8px 20px rgba(61,220,132,.35);
    font-size: 22px;
  }
  h1 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }
  .subtitle { color: var(--muted); font-size: 13px; margin-top: 2px; }

  .scores {
    display: flex;
    gap: 10px;
  }
  .score-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 8px 14px;
    text-align: center;
    min-width: 74px;
  }
  .score-card .label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--muted);
  }
  .score-card .value {
    font-size: 22px;
    font-weight: 700;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }

  .board-wrap {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 14px;
    box-shadow: var(--shadow);
  }
  canvas {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 10px;
    background:
      linear-gradient(0deg, rgba(255,255,255,.015) 1px, transparent 1px) 0 0 / 100% 5.55%,
      linear-gradient(90deg, rgba(255,255,255,.015) 1px, transparent 1px) 0 0 / 5.55% 100%,
      #0b1016;
    touch-action: none;
  }

  .overlay {
    position: absolute;
    inset: 14px;
    border-radius: 10px;
    background: rgba(8, 12, 18, .78);
    backdrop-filter: blur(6px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
    padding: 24px;
    transition: opacity .25s ease;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .overlay h2 { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
  .overlay p { color: var(--muted); font-size: 14px; max-width: 300px; line-height: 1.5; }
  .big-score { color: var(--accent); font-weight: 700; }

  .btn {
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    color: #06210f;
    background: linear-gradient(145deg, var(--accent), var(--accent-2));
    border: none;
    border-radius: 11px;
    padding: 12px 26px;
    cursor: pointer;
    box-shadow: 0 8px 22px rgba(61,220,132,.35);
    transition: transform .12s ease, box-shadow .12s ease, filter .12s ease;
  }
  .btn:hover { transform: translateY(-2px); filter: brightness(1.05); box-shadow: 0 12px 28px rgba(61,220,132,.45); }
  .btn:active { transform: translateY(0); }
  .btn:focus-visible { outline: 3px solid rgba(61,220,132,.5); outline-offset: 2px; }

  .footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .hint { color: var(--muted); font-size: 12.5px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  kbd {
    font-family: inherit;
    font-size: 11px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-bottom-width: 2px;
    border-radius: 6px;
    padding: 2px 7px;
    color: var(--text);
  }
  .speed-toggle { display: flex; gap: 6px; align-items: center; }
  .chip {
    font-family: inherit;
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 12px;
    cursor: pointer;
    transition: all .12s ease;
  }
  .chip.active { color: #06210f; background: var(--accent); border-color: var(--accent); font-weight: 600; }
  .chip:focus-visible { outline: 2px solid rgba(61,220,132,.5); outline-offset: 2px; }

  @media (max-width: 480px) {
    h1 { font-size: 22px; }
    .logo { width: 34px; height: 34px; font-size: 18px; }
    .score-card { min-width: 60px; padding: 7px 10px; }
  }
</style>
</head>
<body>
  <div class="app">
    <header>
      <div class="title">
        <div class="logo" aria-hidden="true">🐍</div>
        <div>
          <h1>Snake</h1>
          <div class="subtitle">Eat, grow, don't bite yourself.</div>
        </div>
      </div>
      <div class="scores">
        <div class="score-card">
          <div class="label">Score</div>
          <div class="value" id="score">0</div>
        </div>
        <div class="score-card">
          <div class="label">Best</div>
          <div class="value" id="best">0</div>
        </div>
      </div>
    </header>

    <div class="board-wrap">
      <canvas id="board" width="450" height="450" aria-label="Snake game board"></canvas>
      <div class="overlay" id="overlay">
        <h2 id="ov-title">Ready to play?</h2>
        <p id="ov-text">Use the arrow keys or WASD to steer. On mobile, swipe on the board.</p>
        <button class="btn" id="startBtn">Start Game</button>
      </div>
    </div>

    <div class="footer">
      <div class="hint">
        <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd>
        <span>or WASD to move · <kbd>Space</kbd> to pause</span>
      </div>
      <div class="speed-toggle" role="group" aria-label="Speed">
        <button class="chip" data-speed="140">Chill</button>
        <button class="chip active" data-speed="100">Normal</button>
        <button class="chip" data-speed="65">Fast</button>
      </div>
    </div>
  </div>

<script>
(() => {
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const CELLS = 18;                 // grid is CELLS x CELLS
  const SIZE = canvas.width / CELLS; // pixel size of one cell

  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ov-title');
  const ovText = document.getElementById('ov-text');
  const startBtn = document.getElementById('startBtn');

  // Game state (in memory only — no persistence in the sandbox)
  let snake, dir, nextDir, food, score, best = 0, speed = 100;
  let loopId = null, running = false, paused = false;

  function reset() {
    const mid = Math.floor(CELLS / 2);
    snake = [ {x: mid-1, y: mid}, {x: mid-2, y: mid}, {x: mid-3, y: mid} ];
    dir = {x: 1, y: 0};
    nextDir = {x: 1, y: 0};
    score = 0;
    scoreEl.textContent = '0';
    placeFood();
  }

  function placeFood() {
    let p;
    do {
      p = { x: (Math.random() * CELLS) | 0, y: (Math.random() * CELLS) | 0 };
    } while (snake.some(s => s.x === p.x && s.y === p.y));
    food = p;
  }

  function start() {
    reset();
    overlay.classList.add('hidden');
    running = true;
    paused = false;
    schedule();
    draw();
  }

  function schedule() {
    clearInterval(loopId);
    loopId = setInterval(tick, speed);
  }

  function tick() {
    if (paused || !running) return;
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // Wall or self collision -> game over
    const hitWall = head.x < 0 || head.y < 0 || head.x >= CELLS || head.y >= CELLS;
    const hitSelf = snake.some(s => s.x === head.x && s.y === head.y);
    if (hitWall || hitSelf) { gameOver(); return; }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score++;
      scoreEl.textContent = score;
      if (score > best) { best = score; bestEl.textContent = best; }
      placeFood();
    } else {
      snake.pop();
    }
    draw();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, r);
    ctx.fill();
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Food with a soft glow
    const fx = food.x * SIZE, fy = food.y * SIZE;
    ctx.save();
    ctx.shadowColor = 'rgba(255,93,93,.7)';
    ctx.shadowBlur = 14;
    ctx.fillStyle = '#ff5d5d';
    roundRect(fx + SIZE*0.22, fy + SIZE*0.22, SIZE*0.56, SIZE*0.56, SIZE*0.28);
    ctx.restore();

    // Snake — gradient head to tail
    for (let i = snake.length - 1; i >= 0; i--) {
      const s = snake[i];
      const t = i / Math.max(snake.length - 1, 1);
      const g = Math.round(220 - t * 70);
      ctx.fillStyle = i === 0 ? '#5cf29b' : `rgb(43, ${g}, 115)`;
      roundRect(s.x * SIZE + 1.5, s.y * SIZE + 1.5, SIZE - 3, SIZE - 3, SIZE*0.3);

      // Eyes on the head
      if (i === 0) {
        ctx.fillStyle = '#06210f';
        const ex = s.x * SIZE, ey = s.y * SIZE;
        const off = SIZE * 0.28, r = SIZE * 0.09;
        const dx = dir.x, dy = dir.y;
        const e1 = { x: ex + SIZE/2 + (dy ? off : dx*off*0.6) - (dy? off:0), y: ey + SIZE/2 + (dx? off : dy*off*0.6) - (dx?off:0) };
        // Simpler: two eyes offset perpendicular to direction
        const px = dy !== 0 ? 1 : 0, py = dx !== 0 ? 1 : 0;
        const cx = ex + SIZE/2 + dx * SIZE*0.12;
        const cy = ey + SIZE/2 + dy * SIZE*0.12;
        ctx.beginPath();
        ctx.arc(cx + px*off, cy + py*off, r, 0, Math.PI*2);
        ctx.arc(cx - px*off, cy - py*off, r, 0, Math.PI*2);
        ctx.fill();
      }
    }
  }

  function gameOver() {
    running = false;
    clearInterval(loopId);
    ovTitle.textContent = 'Game Over';
    ovText.innerHTML = `You scored <span class="big-score">${score}</span> point${score === 1 ? '' : 's'}.` +
                       (score === best && score > 0 ? ' New best! 🎉' : '');
    startBtn.textContent = 'Play Again';
    overlay.classList.remove('hidden');
  }

  function togglePause() {
    if (!running) return;
    paused = !paused;
    if (paused) {
      ovTitle.textContent = 'Paused';
      ovText.textContent = 'Press Space or tap Resume to continue.';
      startBtn.textContent = 'Resume';
      overlay.classList.remove('hidden');
    } else {
      overlay.classList.add('hidden');
    }
  }

  function setDir(x, y) {
    // Prevent 180° reversals
    if (x === -dir.x && y === -dir.y) return;
    nextDir = { x, y };
  }

  // Keyboard controls
  window.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase()) || k===' ') e.preventDefault();
    if (k === 'arrowup' || k === 'w') setDir(0, -1);
    else if (k === 'arrowdown' || k === 's') setDir(0, 1);
    else if (k === 'arrowleft' || k === 'a') setDir(-1, 0);
    else if (k === 'arrowright' || k === 'd') setDir(1, 0);
    else if (k === ' ') { if (running) togglePause(); }
    else if (k === 'enter' && !running) start();
  });

  // Touch / swipe controls
  let touchStart = null;
  canvas.addEventListener('touchstart', (e) => {
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: true });
  canvas.addEventListener('touchmove', (e) => {
    if (!touchStart) return;
    const dx = e.touches[0].clientX - touchStart.x;
    const dy = e.touches[0].clientY - touchStart.y;
    if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0);
    else setDir(0, dy > 0 ? 1 : -1);
    touchStart = null;
    e.preventDefault();
  }, { passive: false });

  startBtn.addEventListener('click', () => {
    if (paused) { togglePause(); }
    else { start(); }
  });

  // Speed selector
  document.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      speed = parseInt(chip.dataset.speed, 10);
      if (running && !paused) schedule();
    });
  });

  // Initial paint (empty board behind overlay)
  reset();
  draw();
})();
</script>
</body>
</html>
